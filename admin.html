<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rush_verso // Admin // Solar Federation Terminal 2112</title>
  <meta name="description" content="Painel administrativo para configurar o gatilho e a mensagem direta do Instagram.">
  <link rel="icon" type="image/svg+xml" href="assets/starman.svg">

  <!-- Design System & Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Celestial Canvas (Cygnus X-1 & Starfield) -->
  <canvas id="starfield-canvas"></canvas>

  <!-- CRT Scanline Retro Ambient Layer -->
  <div class="scanline-overlay"></div>

  <div class="admin-shell">

    <!-- ===================================================================
         LOGIN VIEW
         =================================================================== -->
    <div class="admin-card" id="login-view">
      <div class="modal-header">
        <div class="modal-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          Acesso Administrativo // Templo de Syrinx
        </div>
      </div>

      <form class="modal-body" id="login-form">
        <div class="form-group">
          <label class="form-label" for="admin-password">
            <span>Senha de Administrador</span>
          </label>
          <input
            type="password"
            class="form-input"
            id="admin-password"
            placeholder="••••••••"
            autocomplete="current-password"
            required>
        </div>

        <div class="admin-status-msg admin-status-msg--error" id="login-error"></div>

        <button type="submit" class="btn-primary admin-btn-full">Entrar</button>
      </form>
    </div>

    <!-- ===================================================================
         CONFIG VIEW
         =================================================================== -->
    <div class="admin-card" id="config-view" hidden>
      <div class="modal-header">
        <div class="modal-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          Configuração do Instagram // Gatilho &amp; DM
        </div>
        <button type="button" class="modal-close-btn" id="btn-logout" title="Sair">&times;</button>
      </div>

      <form class="modal-body" id="config-form">
        <div class="form-group">
          <label class="form-label" for="trigger-word">
            <span>Palavra-Gatilho</span>
            <span class="form-hint">(comentário que ativa a DM)</span>
          </label>
          <input
            type="text"
            class="form-input"
            id="trigger-word"
            placeholder="portal"
            required>
        </div>

        <div class="form-group">
          <label class="form-label" for="dm-message">
            <span>Mensagem Direta</span>
            <span class="form-hint">(enviada automaticamente)</span>
          </label>
          <textarea
            class="form-input admin-textarea"
            id="dm-message"
            rows="5"
            placeholder="Olá! Vi seu comentário no post..."
            required></textarea>
        </div>

        <div class="admin-status-msg" id="save-status"></div>
      </form>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="btn-logout-footer">Sair</button>
        <button type="submit" form="config-form" class="btn-primary" id="btn-save">Salvar &amp; Conectar</button>
      </div>
    </div>

  </div>

  <!-- JavaScript Modules with Cache Busting -->
  <script src="js/admin.js?v=2112"></script>

</body>
</html>
